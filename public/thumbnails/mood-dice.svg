<svg width="100%" viewBox="0 0 680 382" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Mood Dice thumbnail</title>
  <rect width="680" height="382" fill="#060608"/>
  <rect x="0" y="0" width="680" height="2" fill="#00e5a0" opacity="0.5"/>
  <!-- dice face -->
  <rect x="250" y="100" width="180" height="180" rx="16" fill="#0a0a0f" stroke="#00e5a0" stroke-width="1.2" opacity="0.8"/>
  <!-- dice dots for face 5 -->
  <circle cx="295" cy="145" r="10" fill="#00e5a0" opacity="0.8"/>
  <circle cx="385" cy="145" r="10" fill="#00e5a0" opacity="0.8"/>
  <circle cx="340" cy="190" r="10" fill="#00e5a0" opacity="0.9"/>
  <circle cx="295" cy="235" r="10" fill="#00e5a0" opacity="0.8"/>
  <circle cx="385" cy="235" r="10" fill="#00e5a0" opacity="0.8"/>
  <!-- result card -->
  <rect x="190" y="305" width="300" height="40" rx="0" fill="#0d0d12" stroke="#00e5a0" stroke-width="0.6" opacity="0.6"/>
  <text x="340" y="329" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00e5a0" opacity="0.7" letter-spacing="1">message a friend you miss</text>
  <!-- NFC -->
  <rect x="300" y="60" width="80" height="24" rx="0" fill="none" stroke="#00e5a0" stroke-width="0.5" opacity="0.4"/>
  <text x="340" y="76" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#00e5a0" opacity="0.5" letter-spacing="2">NFC CARD</text>
  <text x="40" y="355" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5a0" opacity="0.4" letter-spacing="3">009</text>
  <text x="340" y="370" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffffff" opacity="0.5" letter-spacing="4">MOOD DICE</text>
</svg>

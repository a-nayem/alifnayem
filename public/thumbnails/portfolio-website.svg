  <!-- horizontal scan lines -->
  <rect x="0" y="0" width="680" height="1" fill="#ffffff" opacity="0.03"/>
  <rect x="0" y="48" width="680" height="1" fill="#ffffff" opacity="0.03"/>
  <rect x="0" y="96" width="680" height="1" fill="#ffffff" opacity="0.03"/>
  <rect x="0" y="144" width="680" height="1" fill="#ffffff" opacity="0.03"/>
  <rect x="0" y="192" width="680" height="1" fill="#ffffff" opacity="0.03"/>
